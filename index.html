<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- منع الزووم والتكبير عبر إعدادات الشاشة -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة حاتم نعجة جري</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Arial', sans-serif;
            /* منع تحديد النصوص أو إظهار القوائم عند الضغط المطول */
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 26px;
            text-shadow: 2px 2px 4px #000;
        }
        canvas {
            border: 4px solid #e94560;
            background: #16213e;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            max-width: 95%; /* لجعل اللعبة متناسقة مع شاشات الهواتف */
            height: auto;
        }
        .instructions {
            margin-top: 15px;
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>لعبة حاتم نعجة جري 🏃‍♂️💨</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="instructions"><b>اضغط على الشاشة</b> للقفز أو لإعادة اللعب!</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // تحميل صورة الشخصية
    const playerImage = new Image();
    playerImage.src = 'hatim.PNG'; 
    // تحميل صوت الخسارة (تأكد من مطابقة اسم الملف وصيغته)
const loseSound = new Audio('Fart.mp3'); 


    // إعدادات اللاعب
    let player = { 
        x: 100, 
        y: 280, 
        width: 60,   
        height: 60,  
        yVelocity: 0, 
        grounded: false 
    };
    
    const gravity = 0.6;
    const jumpForce = -13;

    // إعدادات العقبات
    let obstacles = [];
    let gameSpeed = 6;
    let score = 0;
    let isGameOver = false;

    // دالة التحكم بالقفز وإعادة اللعب
    function handleAction() {
        if (!isGameOver && player.grounded) {
            player.yVelocity = jumpForce;
            player.grounded = false;
        } else if (isGameOver) {
            resetGame();
        }
    }

    // [للهواتف] الاستماع للمس الشاشة ومنع السلوك الافتراضي (الزووم والاهتزاز)
    window.addEventListener("touchstart", (e) => {
        // منع التكبير والوظائف الإضافية للمتصفح أثناء اللعب
        if (e.target.tagName !== 'A' && e.target.tagName !== 'BUTTON') {
            e.preventDefault(); 
        }
        handleAction();
    }, { passive: false });

    // [للكمبيوتر] دعم أزرار الكيبورد أيضاً
    window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
            if (!isGameOver && player.grounded) {
                player.yVelocity = jumpForce;
                player.grounded = false;
            }
        }
        if (isGameOver && e.code === "KeyR") {
            resetGame();
        }
    });

    function spawnObstacle() {
        if (Math.random() < 0.015 && (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 250)) {
            let height = 30 + Math.random() * 20; 
            obstacles.push({ x: canvas.width, y: 340 - height, width: 30, height: height });
        }
    }

    function resetGame() {
        player.y = 280;
        player.yVelocity = 0;
        obstacles = [];
        score = 0;
        gameSpeed = 6;
        isGameOver = false;
        animate();
        // إيقاف الصوت وإعادته للبداية ليكون جاهزاً للمرة القادمة
loseSound.pause();
loseSound.currentTime = 0;

    }

    function animate() {
        if (isGameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        score++;
        if (score % 500 === 0) gameSpeed += 0.5;

        player.yVelocity += gravity;
        player.y += player.yVelocity;

        if (player.y >= 340 - player.height) {
            player.y = 340 - player.height;
            player.yVelocity = 0;
            player.grounded = true;
        }

        // رسم صورة الشخصية
        ctx.drawImage(playerImage, player.x, player.y, player.width, player.height);

        spawnObstacle();
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;

            ctx.fillStyle = "#e94560";
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

            if (
                player.x < obs.x + obs.width &&
                player.x + player.width > obs.x &&
                player.y < obs.y + obs.height &&
                player.y + player.height > obs.y
            ) {
                isGameOver = true;
                // تشغيل صوت الخسارة فوراً عند التصادم
loseSound.play().catch(error => {
    console.log("المتصفح حظر الصوت حتى يلمس المستخدم الشاشة أولاً:", error);
});

                
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff4757";
                ctx.font = "bold 34px Arial";
                ctx.textAlign = "center";
                ctx.fillText("للاسف خسر حاتم! 🐑", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.fillStyle = "white";
                ctx.font = "22px Arial";
                ctx.fillText(`النتيجة: ${score} نقطة`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("المس الشاشة لإعادة المحاولة", canvas.width / 2, canvas.height / 2 + 60);
            }

            if (obs.x + obs.width < 0) {
                obstacles.splice(i, 1);
            }
        }

        ctx.strokeStyle = "#4ecca3";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 340);
        ctx.lineTo(canvas.width, 340);
        ctx.stroke();

        ctx.fillStyle = "#4ecca3";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "right"; // تم تعديل المحاذاة لتناسب الرؤية على الهاتف
        ctx.fillText(`النقاط: ${score}`, canvas.width - 20, 40);

        requestAnimationFrame(animate);
    }

    playerImage.onload = function() {
        animate();
    };
</script>
</body>
</html>
